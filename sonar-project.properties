# Read by the SonarQube scan in the Blocks Release pipeline, which runs the scanner on
# the repository checkout. The pipeline substitutes its own key, host and token into
# these lines, so keep them even though their values are set there.
sonar.projectKey=asifrafeen-dev-construct-os
sonar.host.url=https://code.selise.biz

sonar.sources=.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**,coverage/**
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,src/test/**

# Written in the pipeline by `npm run blocks:test`, which the Release pipeline's unit-test
# step runs before this scan. The report is not committed.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
