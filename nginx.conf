server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;
  gzip             on;
  gzip_comp_level  6;
  gzip_min_length  1000;
  gzip_proxied     expired no-cache no-store private auth;
  gzip_types       text/plain application/x-javascript text/xml text/css application/xml text/javascript application/javascript application/json application/font-woff application/font-woff2 application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  # Liveness target for a Blocks Monitor "Request" monitor (GET/HEAD) and for the
  # orchestrator. Answered by nginx itself, so it proves the container is serving even
  # when the SPA's own API calls are failing.
  location = /healthz {
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"status":"ok"}';
  }

  # Which build is live — emitted by vite.config.ts. Never cached, or a monitor (or a
  # person) checking a fresh deploy would read the previous one.
  location = /version.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Hashed assets are immutable; index.html is not, so it must be revalidated or a
  # deploy only shows up after the browser cache expires.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
